name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # 测试阶段（main分支push或PR）
  # ============================================
  unit-test:
    runs-on: ubuntu-latest
    name: Unit Tests
    # 只在非 tag push 时运行测试
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: unit-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  build-check:
    runs-on: ubuntu-latest
    name: Build Check
    needs: integration-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          AI_WORKER_DISABLED: '1'

  e2e-test:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: build-check
    timeout-minutes: 60
    env:
      SOLVNOTE_E2E_ISOLATED: '1'
      SOLVNOTE_E2E_TEMP_DIR: ${{ runner.temp }}
      DATABASE_URL: 'file:${{ runner.temp }}/solvnote-e2e-${{ github.run_id }}-${{ github.run_attempt }}.db'
      # Public, synthetic fixtures for this disposable DB; never deployment defaults.
      INITIAL_ADMIN_PASSWORD: 'e2e-only-admin-password-2026-fixture'
      INITIAL_ADMIN_EMAIL: 'admin@localhost'
      NEXTAUTH_SECRET: 'e2e-only-session-secret-2026-disposable-fixture'
      NEXTAUTH_URL: 'http://127.0.0.1:4330'
      AI_WORKER_DISABLED: '1'
      AI_CONFIG_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      SOLVNOTE_ENABLE_AI_CONFIG_EXPORT: 'false'
      SOLVNOTE_TURNSTILE_SITE_KEY: ''
      SOLVNOTE_TURNSTILE_SECRET_KEY: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup Database
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Build application
        run: npm run build
        env:
          AI_WORKER_DISABLED: '1'

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # Docker 构建（仅 tag push）
  # ============================================
  docker-build:
    name: Native Docker Build & Push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      release_tags: true
