<svg xmlns="http://www.w3.org/2000/svg" width="800" height="414" viewBox="0 0 800 414" role="img" aria-labelledby="title desc">
  <title id="title">解析的组织方式：思路、步骤、检验、总结</title>
  <desc id="desc">讲解结构示意，不是某道题的实际AI输出。先解释为什么选这个方法，再逐步说明依据，核对结果，最后提炼方法；没有错误作答证据时不编造个人错因。</desc>
  <rect width="800" height="414" rx="20" fill="#f8fafc"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="32" y="49" font-size="28" font-weight="700" fill="#173b60">一份解析，应当让你看懂这四件事</text>
    <path d="M55 116v234" fill="none" stroke="#cbdde9" stroke-width="3"/>
    <g fill="#fff" stroke="#dce5ec"><rect x="88" y="78" width="680" height="68" rx="12"/><rect x="88" y="160" width="680" height="68" rx="12"/><rect x="88" y="242" width="680" height="68" rx="12"/><rect x="88" y="324" width="680" height="68" rx="12"/></g>
    <g fill="#245e91"><circle cx="55" cy="112" r="19"/><circle cx="55" cy="194" r="19"/></g>
    <g fill="#14796b"><circle cx="55" cy="276" r="19"/><circle cx="55" cy="358" r="19"/></g>
    <g fill="#fff" font-size="20" text-anchor="middle" font-weight="700"><text x="55" y="119">1</text><text x="55" y="201">2</text><text x="55" y="283">3</text><text x="55" y="365">4</text></g>
    <g font-size="24" font-weight="700" fill="#173b60"><text x="109" y="121">思路</text><text x="109" y="203">步骤</text><text x="109" y="285">检验</text><text x="109" y="367">总结</text></g>
    <g font-size="21" fill="#3c5266"><text x="179" y="120">从已知与目标出发，说明为什么选这个方法。</text><text x="179" y="202">每步写清依据；辅助线交代目的和证明条件。</text><text x="179" y="284">把结果代回题设，核对计算、图形与适用条件。</text><text x="179" y="366">提炼可复用的方法；有作答证据时再分析错因。</text></g>
  </g>
</svg>
